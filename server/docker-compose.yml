services:
  mysql:
    image: mysql:8.0
    container_name: campus-forum-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_forum
      MYSQL_USER: forum
      MYSQL_PASSWORD: forum123
    ports:
      - "3306:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: campus-forum-redis
    ports:
      - "6379:6379"

  minio:
    # Docker Hub no longer allows anonymous pulls of minio/minio.
    # pgsty/silo is a MinIO-compatible server: same command, MINIO_ROOT_* env, ports 9000/9001.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: campus-forum-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
