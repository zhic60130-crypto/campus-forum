spring:
  application:
    name: campus-forum-server
  profiles:
    # mysql: MySQL + Redis + MinIO (start server/docker-compose.yml first).
    # Optional zero-Docker path: -Dspring-boot.run.profiles=local
    active: mysql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

forum:
  jwt:
    secret: campus-forum-jwt-secret-change-me-please-32bytes-min
    expire-hours: 24
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5177,http://127.0.0.1:5177"
  upload:
    mode: local
    local-dir: ./uploads
    public-base-url: http://localhost:8080/api/files
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: campus-forum
  interact:
    memory-fallback: true
    sync-cron: "0 */5 * * * *"

logging:
  level:
    com.campus.forum: INFO

---
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/campus_forum;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql

forum:
  interact:
    memory-fallback: true
  upload:
    mode: local


---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_forum?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: forum
    password: forum123
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

forum:
  interact:
    memory-fallback: false
  upload:
    mode: minio
    public-base-url: http://127.0.0.1:9000/campus-forum
