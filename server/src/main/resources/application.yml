spring:
  application:
    name: campus-forum-server
  profiles:
    # 默认本地开发栈（MySQL + Redis + MinIO，见 application-dev.yml）
    active: dev
    group:
      # 兼容旧文档/脚本：激活 mysql 时等价于 dev
      mysql:
        - dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

forum:
  interact:
    sync-cron: "0 */5 * * * *"

logging:
  level:
    root: INFO
    com.campus.forum: INFO

---
# 免 Docker 快捷模式：H2 文件库 + 内存互动 + 本地上传（与 dev/prod 并列，非环境 profile）
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/campus_forum;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql

forum:
  jwt:
    secret: campus-forum-jwt-secret-change-me-please-32bytes-min
    expire-hours: 24
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5177,http://127.0.0.1:5177"
  interact:
    memory-fallback: true
  upload:
    mode: local
    local-dir: ./uploads
    public-base-url: http://localhost:8080/api/files

logging:
  level:
    com.campus.forum: DEBUG
