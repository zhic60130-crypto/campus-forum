spring:
  application:
    name: campus-forum-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:campus_forum}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:forum}
    password: ${MYSQL_PASSWORD:forum123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

forum:
  jwt:
    secret: campus-forum-jwt-secret-change-me-please-32bytes-min
    expire-hours: 24
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5177,http://127.0.0.1:5177"
  upload:
    mode: minio
    local-dir: ./uploads
    public-base-url: http://127.0.0.1:9000/campus-forum
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: campus-forum
  interact:
    memory-fallback: false
    sync-cron: "0 */5 * * * *"

logging:
  level:
    com.campus.forum: INFO
